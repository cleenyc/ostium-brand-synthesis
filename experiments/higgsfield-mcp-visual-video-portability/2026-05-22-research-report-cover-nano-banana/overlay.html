<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; width:2752px; height:1536px; overflow:hidden; background:#080909; }
  .canvas { position:relative; width:2752px; height:1536px; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#FFE8E2; background-image:url('higgsfield-composition-layer.png'); background-size:cover; background-position:center; }
  .shade { position:absolute; inset:0; background:
      radial-gradient(circle at 0% 92%, rgba(255,90,25,0.26), transparent 28%),
      linear-gradient(90deg, rgba(5,6,7,0.94) 0%, rgba(5,6,7,0.88) 23%, rgba(5,6,7,0.42) 38%, transparent 52%); }
  .content { position:absolute; left:170px; top:175px; width:850px; }
  .logo { font-weight:800; letter-spacing:0.15em; font-size:46px; line-height:1; }
  .orange-rule { margin-top:35px; width:150px; height:7px; background:#FF5A19; }
  .title { margin-top:210px; font-weight:850; font-size:130px; line-height:0.98; letter-spacing:-0.045em; }
  .title .orange { color:#FF5A19; }
  .sub { margin-top:72px; font-size:36px; color:rgba(208,219,218,0.9); letter-spacing:-0.015em; }
  .mono { margin-top:26px; font-family:"IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:30px; color:rgba(160,174,174,0.92); }
  .module { position:absolute; left:170px; top:1190px; width:560px; height:142px; border:2px solid rgba(255,232,226,0.22); border-radius:18px; background:rgba(8,9,9,0.52); box-shadow: 0 0 42px rgba(255,90,25,0.07) inset; }
  .module .kicker { margin:31px 0 0 48px; font-family:"DejaVu Sans Mono", ui-monospace, monospace; font-size:28px; color:#FF5A19; letter-spacing:0.03em; }
  .module .desc { margin:14px 0 0 48px; font-size:24px; color:rgba(208,219,218,0.82); }
  .footer { position:absolute; left:170px; bottom:90px; font-size:23px; color:rgba(160,174,174,0.58); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="shade"></div>
    <div class="content">
      <div class="logo">OSTIUM</div>
      <div class="orange-rule"></div>
      <div class="title">GLOBAL<br/>MARKETS<br/><span class="orange">ONCHAIN</span></div>
      <div class="sub">Research cover concept</div>
      <div class="mono">Stocks · commodities · forex · indices · crypto</div>
    </div>
    <div class="module">
      <div class="kicker">PORTABILITY PASS 02</div>
      <div class="desc">composition + exact overlay</div>
    </div>
    <div class="footer">Internal brand-system test · not a public asset</div>
  </div>
</body>
</html>
